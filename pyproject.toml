[project]
name = "multimedia_retrieval"
version = "0.1.0"
requires-python = ">=3.14"

dependencies = [
    "PyOpenGL>=3.1.10",
    "PyOpenGL_accelerate>=3.1.10",
    "matplotlib>=3.11",
    "pandas>=3.0.6",
    "pymeshlab>=2025.7.post1",
    "scikit-learn>=1.9.1",
    "pynndescent>=0.7.0",
    "kaleido>=1.0.0"
]

[tool.setuptools]
py-modules = ["main", "obj_viewer"]